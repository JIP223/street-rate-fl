name: switch-domain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/switch-domain.yml'
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite URLs, add CNAME, remove this workflow
        run: |
          echo streetratefl.com > CNAME
          sed -i 's#https://jip223.github.io/street-rate-fl/#https://streetratefl.com/#g; s#https://jip223.github.io/street-rate-fl#https://streetratefl.com#g' README.md robots.txt sitemap.xml index.html about.html contact.html privacy.html tampa-10x10.html
          git rm -q .github/workflows/switch-domain.yml
          git config user.name 'mogul-bot'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Switch canonical URLs, sitemap, robots to streetratefl.com; add CNAME' -m '-mogul (Grok)'
          git push
